<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var savedPreference = localStorage.getItem('prefers-reduced-motion');
          var isReducedMotion = savedPreference !== null ? savedPreference === 'true' : window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (isReducedMotion) {
            document.documentElement.classList.add('reduce-motion');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Favicons and touch icon (served from /logos/) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/logos/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logos/favicon-16x16.png" />
    <link rel="shortcut icon" href="/logos/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logos/logo-192x192.png" />
      <!-- Structured Data for Organization with logo (use absolute URL to public logo) -->
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Learnmates",
        "url": "https://www.learnmates.org",
        "logo": "https://www.learnmates.org/logos/logo-512x512.png"
      }
      </script>
      <!-- Open Graph defaults for social shares -->
      <meta property="og:title" content="Learnmates | IGCSE & A-Level study resources" />
      <meta property="og:description" content="Learnmates offers IGCSE and A-Level videos, notes, quizzes and topical question generators for self-paced exam prep." />
      <meta property="og:url" content="https://www.learnmates.org" />
      <meta property="og:type" content="website" />
      <meta property="og:image" content="https://www.learnmates.org/logos/logo-192x192.png" />
      <meta property="og:image:width" content="192" />
      <meta property="og:image:height" content="192" />
      <meta name="twitter:card" content="summary" />
      <meta name="twitter:title" content="Learnmates | IGCSE & A-Level study resources" />
      <meta name="twitter:description" content="Learnmates offers IGCSE and A-Level videos, notes, quizzes and topical question generators for self-paced exam prep." />
      <meta name="twitter:image" content="https://www.learnmates.org/logos/logo-192x192.png" />

      <!-- Page-specific metadata injector (for JS-enabled clients) -->
      <script>
        async function updatePageMeta() {
          try {
            const res = await fetch('/metadata.json');
            if (!res.ok) return;
            const data = await res.json();
            const path = window.location.pathname;

            // try exact match first, then normalized path fallback
            let meta = data?.topics?.[path] || data?.topics?.[decodeURIComponent(path)];
            if (!meta && path.startsWith('/curriculum')) {
              // When a subject page path ends with /type/board/subject or /type/board/subject/title
              meta = data?.topics?.[path];
            }

            if (!meta) return;

            const title = meta.title || document.title;
            const description = meta.description || document.querySelector('meta[name="description"]')?.getAttribute('content') || '';
            const keywords = meta.keywords || document.querySelector('meta[name="keywords"]')?.getAttribute('content') || '';
            const url = (meta.url ? new URL(meta.url, 'https://www.learnmates.org').href : window.location.href);
            const image = (meta.ogImage || 'https://www.learnmates.org/logos/og-image.png');

            document.title = title;
            const updateMetaTag = (selector, attr, value) => {
              let tag = document.querySelector(selector);
              if (!tag) {
                tag = document.createElement('meta');
                const [nameProp, nameVal] = selector.match(/\[([^=]+)=\"([^\"]+)\"]/).slice(1,3);
                tag.setAttribute(nameProp, nameVal);
                document.head.appendChild(tag);
              }
              tag.setAttribute(attr, value);
            };

            updateMetaTag('meta[name="description"]', 'content', description);
            updateMetaTag('meta[name="keywords"]', 'content', keywords);
            updateMetaTag('meta[property="og:title"]', 'content', title);
            updateMetaTag('meta[property="og:description"]', 'content', description);
            updateMetaTag('meta[property="og:url"]', 'content', url);
            updateMetaTag('meta[property="og:image"]', 'content', image);
            updateMetaTag('meta[name="twitter:title"]', 'content', title);
            updateMetaTag('meta[name="twitter:description"]', 'content', description);
            updateMetaTag('meta[name="twitter:image"]', 'content', image);
          } catch (err) {
            console.warn('Failed to update metadata from metadata.json', err);
          }
        }

        updatePageMeta();
      </script>
